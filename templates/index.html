<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: #fff;
            margin: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .video-box {
            display: inline-block;
            background: #000;
            margin-bottom: 20px;
        }

        .video-box img {
            display: block;
            max-width: 800px;
            width: 100%;
            height: auto;
        }

        .controls {
            display: flex;
            gap: 16px;
            align-items: center;
            background: #222;
            padding: 14px 20px;
            border-radius: 6px;
        }

        input[type="file"] {
            color: #ccc;
            font-size: 14px;
        }

        button {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            background: #444;
            color: #fff;
            border: 1px solid #666;
            border-radius: 4px;
        }

        button:hover {
            background: #555;
        }
    </style>
</head>
<body>

    <div class="video-box">
        <img src="{{ url_for('video_feed') }}" alt="Live Feed">
    </div>

    <div class="controls">
        <form action="/upload" method="POST" enctype="multipart/form-data" style="display: inline-flex; align-items: center; gap: 10px;">
            <input type="file" name="video" accept="video/*" required>
            <button type="submit">Upload Video</button>
        </form>
        <form action="/reset" method="POST" style="display: inline;">
            <button type="submit">Default Video</button>
        </form>
    </div>

</body>
</html>
